<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería Alejandría | Sistema de Gestión</title>
    <!-- Ruta corregida a la carpeta css -->
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Librería Alejandría</h1>
            <p class="subtitle">Sistema de Control de Inventario y Ventas</p>
        </div>
    </header>

    <main class="container">
        <!-- SECCIÓN 1: Formulario de Registro -->
        <section class="card">
            <h2>Registrar Nuevo Ejemplar</h2>
            <form id="book-form">
                <div class="form-group">
                    <label for="isbn">ISBN / Código (Único y numérico)*</label>
                    <input type="text" id="isbn" placeholder="Ej. 123456789" pattern="[0-9]+" title="El código solo debe contener números" required>
                </div>
                <div class="form-group">
                    <label for="title">Título de la Obra*</label>
                    <input type="text" id="title" placeholder="Ej. Cien años de soledad" required>
                </div>
                <div class="form-group">
                    <label for="author">Autor (Solo letras)*</label>
                    <input type="text" id="author" placeholder="Ej. Gabriel García Márquez" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="El autor solo debe contener letras y espacios" required>
                </div>
                <div class="form-group">
                    <label for="category">Categoría*</label>
                    <select id="category" required>
                        <option value="">Seleccione una categoría...</option>
                        <option value="Ficción">Ficción</option>
                        <option value="No Ficción">No Ficción</option>
                        <option value="Ciencia">Ciencia</option>
                        <option value="Historia">Historia</option>
                        <option value="Infantil">Infantil</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="price">Precio (S/)*</label>
                    <input type="number" id="price" step="0.01" min="0.1" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="stock">Stock Inicial (Unidades)*</label>
                    <input type="number" id="stock" min="0" step="1" placeholder="0" required>
                </div>
                <button type="submit" class="btn btn-primary">Ingresar al Inventario</button>
            </form>
            <div id="form-message" class="message hidden"></div>
        </section>

        <!-- SECCIÓN 2: Catálogo y Búsqueda -->
        <section class="card">
            <h2>Catálogo y Punto de Venta</h2>
            
            <div class="filter-section">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Buscar obra por título o autor...">
                </div>
                <select id="filter-category">
                    <option value="Todas">Explorar todas las categorías</option>
                    <option value="Ficción">Ficción</option>
                    <option value="No Ficción">No Ficción</option>
                    <option value="Ciencia">Ciencia</option>
                    <option value="Historia">Historia</option>
                    <option value="Infantil">Infantil</option>
                </select>
            </div>

            <div class="table-container">
                <table id="books-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título de la Obra</th>
                            <th>Autor</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acción Comercial</th>
                        </tr>
                    </thead>
                    <tbody id="books-body">
                        <!-- Los libros se inyectarán aquí -->
                    </tbody>
                </table>
            </div>
            
            <div id="sale-summary" class="sale-summary hidden"></div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Librería Alejandría. Sistema de gestión interna.</p>
    </footer>

    <!-- Ruta corregida a la carpeta js -->
    <script src="js/app.js"></script>
</body>
</html>
